<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one centered study column; today's numbers and mode switches above, the exercise in the middle, answer controls below. Article colors der/die/das are the content's own code. */
:root{
  --bg:#eef0f3; --card:#ffffff; --card-2:#f6f7fa; --fg:#1d2330; --muted:#5d6676; --line:#d7dbe3;
  --accent:#2f4a7a;
  --der:#2763c4; --die:#c8344a; --das:#23885a; --none:#6b7385;
  --again:#c8344a; --hard:#b0661a; --good:#23885a; --easy:#2763c4;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --card:#1b212c; --card-2:#222937; --fg:#e8ebf1; --muted:#9aa3b4; --line:#2e3646;
  --accent:#9db6e6; --der:#6a9cf0; --die:#ef7184; --das:#5cc792; --none:#9aa3b4;
  --again:#ef7184; --hard:#e8a15a; --good:#5cc792; --easy:#6a9cf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --card:#1b212c; --card-2:#222937; --fg:#e8ebf1; --muted:#9aa3b4; --line:#2e3646;
  --accent:#9db6e6; --der:#6a9cf0; --die:#ef7184; --das:#5cc792; --none:#9aa3b4;
  --again:#ef7184; --hard:#e8a15a; --good:#5cc792; --easy:#6a9cf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.today{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.today b{font-weight:700}
.today .d b{color:var(--good)} .today .n b{color:var(--easy)} .today .x b{color:var(--again)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.bar .m{background:var(--good)} .bar .y{background:color-mix(in srgb,var(--good) 40%,var(--line))}
.barlbl{font-size:.8rem;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}

.modes{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mlabel{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card-2);flex-wrap:wrap}
.seg button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--fg);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:700}
.modegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modegrid button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--card-2);color:var(--fg);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.modegrid button span{font-size:1.2rem}
.modegrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);color:var(--fg)}

.themes{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:.85rem;padding:6px 10px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chip .due{background:var(--good);color:var(--bg);font-size:.72rem;font-weight:700;border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.linkbtn[disabled]{opacity:.4;cursor:default}

.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:460px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;display:block;outline:none}
.card:focus-visible .face{outline:3px solid var(--accent);outline-offset:2px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgb(20 30 50 / .08);overflow:hidden;display:flex;flex-direction:column}
.face::before{content:"";height:8px;background:var(--stripe,var(--none));flex:none}
.front{text-align:center}
.front .inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.pic{font-size:7rem;line-height:1;filter:drop-shadow(0 6px 10px rgb(0 0 0 / .12))}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--card-2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.front.noword .photo{aspect-ratio:1/1}
.front.noword .pic{font-size:9rem}
.word{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.1;text-wrap:balance;margin:0}
.word.ca{font-family:var(--body);font-weight:700}
.art{color:var(--art);font-weight:500}
.sub{color:var(--muted);font-size:.95rem}
.ask{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 16px 18px}
.newtag{position:absolute;top:18px;right:14px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--easy);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.back{transform:rotateY(180deg)}
.back .inner{flex:1;overflow-y:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.bhead{display:flex;gap:12px;align-items:center}
.bhead .mini{font-size:2.2rem;flex:none}
.bhead .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none}
.bhead .word{font-size:1.5rem}
.tr{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;background:var(--card-2);border-radius:10px;padding:12px 14px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tr .v{font-size:1.1rem;font-weight:700;min-width:0}
.note{font-size:.9rem;color:var(--die);margin:0}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{border-left:3px solid var(--art,var(--none));padding-left:12px}
.ex .de{font-weight:700}
.ex .cat{color:var(--muted);font-style:italic}
.photobar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.88rem;border-top:1px solid var(--line);padding-top:10px}
.photobar .status{color:var(--muted)}

.answer{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.answer.two{grid-template-columns:1fr 1fr}
.answer.one{grid-template-columns:1fr}
.answer button,.btn{font:inherit;font-weight:700;font-size:.95rem;padding:10px 4px;border-radius:12px;cursor:pointer;border:2px solid var(--c,var(--accent));background:var(--card);color:var(--c,var(--accent));display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.answer button small{font-weight:400;font-size:.75rem;opacity:.85;font-variant-numeric:tabular-nums}
.answer button.fill,.btn.fill{background:var(--c,var(--accent));color:var(--bg)}
.nav{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88rem;gap:8px}
.done{text-align:center;padding:40px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .pic{font-size:4rem}
.done h2{font-family:var(--display);font-size:1.3rem;margin:0}

/* cloze */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 24px rgb(20 30 50 / .08)}
.cz-top{display:flex;align-items:center;gap:12px}
.cz-top .mini{font-size:2.4rem}
.cz-top .thumb{width:56px;height:56px;border-radius:8px;object-fit:cover}
.cz-sent{font-family:var(--display);font-size:clamp(1.3rem,5.5vw,1.7rem);font-weight:700;line-height:1.35;margin:0;text-wrap:pretty}
.gap{display:inline-block;min-width:4ch;border-bottom:3px solid var(--accent);color:var(--accent);padding:0 4px}
.gap.ok{color:var(--good);border-color:var(--good)}
.gap.bad{color:var(--again);border-color:var(--again)}
.cz-tr{color:var(--muted);font-style:italic;margin:0}
.cz-in{display:flex;gap:8px}
.cz-in input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card-2);color:var(--fg)}
.cz-in input:focus{outline:none;border-color:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{font:inherit;font-size:1rem;font-weight:700;padding:12px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);color:var(--fg);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card));}
.opts button.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 18%,var(--card));}
.feedback{border-radius:10px;padding:10px 12px;background:var(--card-2);display:flex;flex-direction:column;gap:4px}
.feedback .r{font-weight:700}
.feedback.ok .r{color:var(--good)} .feedback.bad .r{color:var(--again)}
.uml{display:flex;gap:6px;flex-wrap:wrap}
.uml button{font:inherit;font-size:.95rem;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);cursor:pointer}

/* texts */
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.titem b{font-family:var(--display);font-size:1.1rem}
.titem .meta{color:var(--muted);font-size:.82rem}
.titem .score{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--good);font-weight:700;flex:none}
.ttext{font-size:1.08rem;line-height:2.1;margin:0}
.ttext input,.ttext select{font:inherit;font-size:1rem;padding:2px 6px;border-radius:6px;border:2px solid var(--line);background:var(--card-2);color:var(--fg);max-width:100%}
.ttext input{width:9ch}
.ttext .ok{border-color:var(--good)!important;color:var(--good)}
.ttext .bad{border-color:var(--again)!important;color:var(--again)}
.ttext .fix{font-size:.85rem;color:var(--good);font-weight:700;margin-left:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem}
.bank span.used{opacity:.35;text-decoration:line-through}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1;min-width:120px}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend{display:flex;gap:12px}
.legend b{font-weight:700}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.answer button{font-size:.85rem}.modegrid button{font-size:.72rem}}
@media (prefers-reduced-motion: reduce){.card{transition:none}}

[hidden]{display:none!important}
/* ---- v6 layout: compact top bar, bottom tab bar, sheets ---- */
:root{--tabh:64px}
#area{display:flex;flex-direction:column;gap:12px}
.foot{flex-wrap:nowrap}
.foot .legend{flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--card)}
.topbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tb-row{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:56px}
.themebtn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px 6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.themebtn .tb-k{font-size:.78rem;color:var(--muted)}
.themebtn .tb-v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.themebtn svg,.iconbtn svg,.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);cursor:pointer}
.today{gap:10px;font-size:.85rem;flex:none}
.topbar .bar{max-width:560px;margin:0 auto 8px;height:4px}
.wrap{padding-block:16px calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}
.foot{font-size:.8rem;align-items:center}
.foot .legend{gap:10px}
.sync{margin:0;font-size:.78rem;color:var(--muted);text-align:center}
.sync:empty{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabbar button{min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;cursor:pointer;border-radius:12px;max-width:140px;justify-self:center;width:100%}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.tabbar button[aria-pressed="true"] svg{stroke-width:2.2}
.mlabel{font-size:.9rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg)}
.ask{text-transform:none;letter-spacing:0;font-size:.9rem}
.newtag{text-transform:none;letter-spacing:0;font-size:.78rem}
.card{min-height:clamp(330px,calc(100dvh - 330px),520px)}
.pic{font-size:clamp(4.5rem,18vw,7rem)}
.front.noword .pic{font-size:clamp(6rem,26vw,9rem)}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgb(10 14 22 / .45)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:min(80dvh,640px);overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -10px 40px rgb(10 20 40 / .25);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:-8px;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding-top:8px;z-index:1}
.sheet-head h2{font-family:var(--display);font-size:1.25rem;margin:0}
.tlist2{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.trow .nm{flex:1;min-width:0}
.trow .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.trow .due{background:var(--good);color:var(--bg);font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.trow[aria-current="true"]{color:var(--accent);font-weight:700}
.trow[aria-current="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:12px}
.setrow .seg button{min-height:44px;padding:6px 8px;font-size:.88rem}
.setrow select{min-height:44px;font-size:1rem}
.seg button,.chip,.opts button,.btn,.answer button,.trow,.tabbar button,.iconbtn,.themebtn,.titem,.uml button{transition:transform .12s ease,background-color .15s ease,border-color .15s ease}
.seg button:active,.opts button:active,.btn:active,.answer button:active,.trow:active,.tabbar button:active,.iconbtn:active,.themebtn:active,.titem:active,.uml button:active{transform:scale(.97)}
@media (hover:hover){.titem:hover,.trow:hover{background:var(--card-2)}.opts button:hover{border-color:var(--accent)}}
.answer button,.btn{min-height:48px}
.uml button{min-width:40px;min-height:40px}
.opts button{min-height:52px}
.cz-switch{background:none;border:0;color:var(--accent);font:inherit;font-size:.88rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 4px}
@media (prefers-reduced-motion: reduce){.sheet-panel{animation:none}}
.themebtn .tb-v{flex:0 1 auto;min-width:3.5em}
.themebtn>svg{margin-left:auto}
.themebtn{gap:6px;padding:6px 8px 6px 10px;overflow:hidden}
.tb-pos{flex:none;font-size:.78rem;font-weight:700;color:var(--bg);background:var(--accent);border-radius:999px;padding:2px 8px;max-width:6.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posgrid{display:flex;flex-wrap:wrap;gap:8px}
.posgrid button{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card-2);color:var(--fg);font:inherit;font-size:.92rem;cursor:pointer}
.posgrid button .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.posgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.posgrid button[aria-pressed="true"] .n{color:inherit;opacity:.85}
.posgrid button:disabled{opacity:.4;cursor:default}
.poshint{font-size:.82rem;color:var(--muted)}
</style>

<header class="topbar">
  <div class="tb-row">
    <button class="themebtn" id="themeBtn" type="button" aria-haspopup="dialog" aria-controls="themeSheet"><span class="tb-k">Tema</span><span class="tb-v" id="themeName">Totes</span><span class="tb-pos" id="posBadge" hidden></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="today" id="today" aria-live="polite"></div>
    <button class="iconbtn" id="setBtn" type="button" aria-label="Opcions d'estudi" aria-haspopup="dialog" aria-controls="setSheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h4"/><path d="M12 17h8"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="bar" aria-hidden="true"><i class="m" id="barM"></i><i class="y" id="barY"></i></div>
</header>

<main class="wrap">
  <div id="area">
    <div class="done"><div class="pic">⏳</div><div>Carregant les targetes…</div></div>
  </div>
  <div class="foot">
    <span id="barLbl"></span>
    <span class="legend"><b style="color:var(--der)">der</b><b style="color:var(--die)">die</b><b style="color:var(--das)">das</b></span>
  </div>
  <p class="sync" id="sync"></p>
</main>

<nav class="tabbar" id="modeSeg" aria-label="Mode d'estudi">
  <button type="button" data-mode="srs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg><span>Repàs</span></button>
  <button type="button" data-mode="free"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg><span>Lliure</span></button>
  <button type="button" data-mode="cloze"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4"/><path d="M16 7h4"/><path d="M10 7h4" stroke-dasharray="1.5 2"/><path d="M4 13h16"/><path d="M4 19h10"/></svg><span>Frases</span></button>
  <button type="button" data-mode="texts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v17H5.5A2.5 2.5 0 0 0 3 22z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v17h5.5a2.5 2.5 0 0 1 2.5 2z"/></svg><span>Textos</span></button>
</nav>

<div class="sheet" id="themeSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
    <div class="sheet-head"><h2 id="themeTitle">Què vols practicar?</h2><button class="iconbtn" type="button" data-close aria-label="Tanca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="setrow"><span class="mlabel">Tipus de paraula</span><div class="posgrid" id="posGrid" role="group" aria-label="Tipus de paraula"></div><span class="poshint" id="posHint"></span></div>
    <span class="mlabel">Tema</span>
    <div class="tlist2" id="themes"></div>
  </div>
</div>

<div class="sheet" id="setSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-head"><h2 id="setTitle">Opcions</h2><button class="iconbtn" type="button" data-close aria-label="Tanca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="setrow" data-for="cards">
      <span class="mlabel">Direcció</span>
      <div class="seg" id="dirSeg" role="group" aria-label="Direcció">
        <button type="button" data-dir="de">Alemany → català</button>
        <button type="button" data-dir="ca">Català → alemany</button>
        <button type="button" data-dir="mix">Barrejat</button>
      </div>
    </div>
    <div class="setrow" data-for="cards">
      <span class="mlabel">Davant de la targeta</span>
      <label class="switch"><input type="checkbox" id="showWord"><span class="track"></span><span id="showWordLbl">Imatge i paraula</span></label>
    </div>
    <div class="setrow" data-for="srs">
      <label class="mlabel" for="newPerDay">Paraules noves al dia</label>
      <select id="newPerDay"><option>5</option><option>10</option><option>15</option><option>20</option><option>30</option><option>50</option></select>
    </div>
    <div class="setrow" data-for="fill">
      <span class="mlabel">Com respons</span>
      <div class="seg" id="ansSeg" role="group" aria-label="Com respons">
        <button type="button" data-ans="choice">Tria entre opcions</button>
        <button type="button" data-ans="type">Escriu-la</button>
      </div>
    </div>
    <button class="btn fill" type="button" data-close>Fet</button>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(function(){
  const $=s=>document.getElementById(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const artColor=a=>a==='der'?'var(--der)':a==='die'?'var(--die)':a==='das'?'var(--das)':(a&&a.includes('/'))?'var(--accent)':'var(--none)';
  const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const DAY=86400000, MIN=60000;
  const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  let cards=[], texts=[], queue=[], idx=0, theme='Totes', flipped=false;
  let prefs=Object.assign({dir:'de',showWord:true,mode:'srs',newPerDay:15,ans:'choice'},load('wortkarten-prefs',{}));
  const savePrefs=()=>store('wortkarten-prefs',prefs);
  const isCardMode=()=>prefs.mode==='srs'||prefs.mode==='free';

  // ---------- Spaced repetition (simplified SM-2, like Anki) ----------
  let srs=load('wortkarten-srs',{});
  function schedule(s,grade){
    const now=Date.now();
    s=Object.assign({ivl:0,ease:2.5,reps:0,lapses:0,first:now},s||{});
    let ivl;
    if(grade===1){ s.lapses+= s.reps>0?1:0; s.reps=0; s.ease=Math.max(1.3,s.ease-.2); s.ivl=0; s.due=now+MIN; s.t=now; return s; }
    if(grade===2){ ivl = s.reps===0?1 : Math.max(s.ivl+1, Math.round(s.ivl*1.2)); s.ease=Math.max(1.3,s.ease-.15); }
    if(grade===3){ ivl = s.reps===0?1 : s.reps===1?3 : Math.max(s.ivl+1, Math.round(s.ivl*s.ease)); }
    if(grade===4){ ivl = s.reps===0?4 : Math.max(s.ivl+2, Math.round(s.ivl*s.ease*1.3)); s.ease+=.15; }
    s.reps++; s.ivl=ivl; s.due=startOfDay(now)+ivl*DAY+4*3600000; s.t=now;
    return s;
  }
  const fmtIvl=s=>{ if(!s.ivl) return '<1 min'; if(s.ivl<30) return s.ivl+' d'; if(s.ivl<365) return Math.round(s.ivl/30)+' mes'; return (s.ivl/365).toFixed(1)+' any'; };
  (function migrate(){
    const old=load('wortkarten-known',null);
    if(!old||!old.length||Object.keys(srs).length) return;
    const now=Date.now();
    old.forEach((id,i)=>{srs[id]={ivl:3,ease:2.5,reps:2,lapses:0,first:now,t:now,due:startOfDay(now)+(1+i%4)*DAY+4*3600000}});
    store('wortkarten-srs',srs);
  })();

  let db=null, assets=null, srsCol=null, writeQ=Promise.resolve();
  function persist(id){
    store('wortkarten-srs',srs);
    if(!srsCol) return;
    const data=srs[id];
    writeQ=writeQ.then(()=>srsCol.doc(id).set(data)).catch(()=>{$('sync').textContent='No s\'ha pogut sincronitzar'});
  }

  const themesOf=c=>[c.theme,...(c.also||[])];
  const POS=[['noun','Substantius'],['verb','Verbs'],['adj','Adjectius'],['adv','Adverbis i connectors'],['phrase','Expressions']];
  const POSNAME=Object.fromEntries(POS);
  let posSel=new Set(load('wortkarten-pos',[]));
  const posOk=c=>!posSel.size||posSel.has(c.pos);
  const inTheme=c=>(theme==='Totes'||themesOf(c).includes(theme))&&posOk(c);
  function introducedToday(){ const sod=startOfDay(Date.now()); return Object.values(srs).filter(s=>s.first>=sod).length; }
  function counts(pool){
    const now=Date.now(); let due=0,neu=0,mature=0,young=0;
    pool.forEach(c=>{const s=srs[c.id]; if(!s){neu++;return} if(s.due<=now) due++; if(s.ivl>=21) mature++; else young++;});
    return {due,neu,mature,young};
  }
  const pickDir=()=>prefs.dir==='mix'?(Math.random()<.5?'de':'ca'):prefs.dir;

  // ---------- queue per mode ----------
  let score={ok:0,bad:0}, openText=null;
  function buildQueue(){
    const pool=cards.filter(inTheme), now=Date.now();
    score={ok:0,bad:0}; openText=null;
    if(prefs.mode==='free'){
      queue=shuffle(pool.slice()).map(c=>({c,dir:pickDir()}));
    } else if(prefs.mode==='srs'){
      const due=shuffle(pool.filter(c=>srs[c.id]&&srs[c.id].due<=now));
      const left=Math.max(0,prefs.newPerDay-introducedToday());
      const neu=pool.filter(c=>!srs[c.id]).slice(0,left);
      const q=due.slice(); neu.forEach((c,i)=>q.splice(Math.min(q.length,Math.round((i+1)*(q.length/(neu.length+1))+i)),0,c));
      queue=q.map(c=>({c,dir:pickDir()}));
    } else if(prefs.mode==='cloze'){
      // words you're learning first, then the rest; each item picks one example sentence
      const seen=shuffle(pool.filter(c=>srs[c.id])), rest=shuffle(pool.filter(c=>!srs[c.id]));
      queue=seen.concat(rest).map(c=>({c,ex:c.ex[Math.floor(Math.random()*c.ex.length)]}));
    } else queue=[];
    idx=0; flipped=false; render();
  }

  function renderTop(){
    const pool=cards.filter(inTheme), k=counts(pool);
    const left=Math.max(0,prefs.newPerDay-introducedToday());
    if(prefs.mode==='srs') $('today').innerHTML=`<span class="d" title="per repassar"><b>${k.due}</b> repàs</span><span class="n" title="paraules noves avui"><b>${Math.min(left,k.neu)}</b> noves</span>`;
    else if(prefs.mode==='cloze') $('today').innerHTML=`<span class="d" title="encerts"><b>${score.ok}</b> ✓</span><span class="x" title="errors"><b>${score.bad}</b> ✗</span>`;
    else if(prefs.mode==='texts'){ const n=texts.filter(t=>theme==='Totes'||t.theme===theme).length; $('today').innerHTML=`<span>${n||texts.length} textos</span>`; }
    else $('today').innerHTML=`<span>${pool.length} paraules</span>`;
    const tot=pool.length||1;
    $('barM').style.width=(k.mature/tot*100)+'%'; $('barY').style.width=(k.young/tot*100)+'%';
    $('barLbl').textContent=`${k.mature} consolidades, ${k.young} aprenent, ${k.neu} sense veure`;
    $('themeName').textContent=theme;
    const pb=$('posBadge'); pb.hidden=!posSel.size; document.querySelector('.themebtn .tb-k').hidden=!!posSel.size; pb.textContent=posSel.size===1?POSNAME[[...posSel][0]]:posSel.size+' tipus';
    const base=cards.filter(c=>theme==='Totes'||themesOf(c).includes(theme));
    $('posGrid').innerHTML=POS.map(([k,n])=>{const cnt=base.filter(c=>c.pos===k).length;return `<button type="button" data-pos="${k}" aria-pressed="${posSel.has(k)}"${cnt?'':' disabled'}><span>${n}</span><span class="n">${cnt}</span></button>`}).join('');
    $('posHint').textContent=posSel.size?'Toca de nou per treure el filtre.':'Cap seleccionat: totes les paraules.';
    const themes=[...new Set(cards.flatMap(themesOf))].sort((a,b)=>a.localeCompare(b,'ca'));
    $('themes').innerHTML=['Totes',...themes].map(t=>{
      const p=(t==='Totes'?cards:cards.filter(c=>themesOf(c).includes(t))).filter(posOk), d=counts(p).due;
      const tn=prefs.mode==='texts'?(t==='Totes'?texts.length:texts.filter(x=>x.theme===t).length):null;
      return `<button class="trow" type="button" aria-current="${t===theme}" data-t="${esc(t)}"><span class="nm">${esc(t)}</span>${prefs.mode==='srs'&&d?`<span class="due" title="per repassar avui">${d}</span>`:''}<span class="n">${tn!=null?(tn===1?'1 text':tn+' textos'):p.length}</span></button>`}).join('');
    document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===prefs.mode));
    document.querySelectorAll('#dirSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===prefs.dir));
    document.querySelectorAll('#ansSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ans===prefs.ans));
    $('showWord').checked=prefs.showWord;
    $('showWordLbl').textContent=prefs.showWord?'Imatge i paraula':'Només la imatge';
    $('newPerDay').value=String(prefs.newPerDay);
    document.querySelectorAll('[data-for]').forEach(el=>{
      const f=el.dataset.for;
      el.hidden=!(f==='cards'?isCardMode():f==='srs'?prefs.mode==='srs':(prefs.mode==='cloze'||prefs.mode==='texts'));
    });
  }

  const deHead=c=>(c.art?`<span class="art">${esc(c.art)}</span> `:'')+esc(c.de);
  const photos={};
  const photoUrl=id=>photos[id]?'/_blob/'+photos[id]:null;
  function visual(c,big){
    const u=photoUrl(c.id);
    if(u) return big?`<div class="photo"><img src="${u}" alt=""></div>`:`<img class="thumb" src="${u}" alt="">`;
    return big?`<div class="pic" aria-hidden="true">${c.img||'📘'}</div>`:`<span class="mini" aria-hidden="true">${c.img||'📘'}</span>`;
  }

  function render(){
    renderTop();
    if(prefs.mode==='cloze') return renderCloze();
    if(prefs.mode==='texts') return renderTexts();
    const item=queue[idx];
    if(!item){
      const tomorrow=cards.filter(inTheme).filter(c=>srs[c.id]&&srs[c.id].due<=startOfDay(Date.now())+DAY+4*3600000+1).length;
      $('area').innerHTML=prefs.mode==='srs'
        ?`<div class="done"><div class="pic">🎉</div><h2>Has acabat per avui</h2><div class="sub">${theme==='Totes'?'':esc(theme)+': '}demà tindràs unes ${tomorrow} paraules per repassar.</div><div class="row"><button class="linkbtn" id="more" type="button">Practica lliure</button><button class="linkbtn" id="more2" type="button">Completa frases</button></div></div>`
        :`<div class="done"><div class="pic">✅</div><h2>Tema repassat</h2><button class="linkbtn" id="more" type="button">Torna a començar</button></div>`;
      $('more').onclick=()=>{prefs.mode='free';savePrefs();buildQueue()};
      if($('more2')) $('more2').onclick=()=>{prefs.mode='cloze';savePrefs();buildQueue()};
      return;
    }
    const c=item.c, dir=item.dir, col=artColor(c.art), st=srs[c.id];
    const sub=[c.extra,c.pl?('pl. '+c.pl):''].filter(Boolean).map(esc).join(', ');
    const frontStripe=dir==='de'?col:'var(--none)';
    const frontWord=!prefs.showWord?'':dir==='de'?`<p class="word">${deHead(c)}</p>`:`<p class="word ca">${esc(c.ca)}</p>`;
    const ask=dir==='de'?(prefs.showWord?'Què vol dir?':'Quina paraula alemanya és?'):'Digues-ho en alemany, amb l\'article';
    const isNew=prefs.mode==='srs'&&!st;
    const photoCtl=assets?`<div class="photobar"><button class="linkbtn" type="button" data-act="photo">${photos[c.id]?'Canvia la foto':'📷 Posa-hi una foto real'}</button>${photos[c.id]?'<button class="linkbtn" type="button" data-act="rmphoto">Treu la foto</button>':''}<span class="status" id="pstatus"></span></div>`:'';
    $('area').innerHTML=`
      <div class="stage">
        <div class="card${flipped?' flipped':''}" id="card" role="button" tabindex="0" aria-label="Gira la targeta" style="--art:${col}">
          <div class="face front${prefs.showWord?'':' noword'}" style="--stripe:${frontStripe}">
            ${isNew?'<span class="newtag">Nova</span>':''}
            <div class="inner">${visual(c,true)}${frontWord}</div>
            <div class="ask">${ask}</div>
          </div>
          <div class="face back" style="--stripe:${col}">
            <div class="inner">
              <div class="bhead">${visual(c,false)}<div><p class="word">${deHead(c)}</p>${sub?`<div class="sub">${sub}</div>`:''}</div></div>
              <div class="tr"><span class="tag">CAT</span><span class="v">${esc(c.ca)}</span><span class="tag">ENG</span><span class="v">${esc(c.en)}</span></div>
              ${c.note?`<p class="note">${esc(c.note)}</p>`:''}
              <ul class="ex">${c.ex.map(e=>`<li><div class="de">${esc(e[0])}</div><div class="cat">${esc(e[1])}</div></li>`).join('')}</ul>
              ${photoCtl}
            </div>
          </div>
        </div>
      </div>
      <div class="answer ${flipped?(prefs.mode==='srs'?'':'two'):'one'}" id="answer"></div>
      <div class="nav"><span>${esc(c.theme)}</span><span style="font-variant-numeric:tabular-nums">${idx+1} de ${queue.length}</span></div>`;
    renderAnswer(c);
    const card=$('card');
    card.onclick=e=>{
      const act=e.target.closest('[data-act]');
      if(act){e.stopPropagation(); if(act.dataset.act==='photo') pickPhoto(c.id); else removePhoto(c.id); return}
      flip();
    };
    card.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
  }
  function flip(){ flipped=!flipped; $('card').classList.toggle('flipped',flipped); const a=$('answer'); a.className='answer '+(flipped?(prefs.mode==='srs'?'':'two'):'one'); renderAnswer(queue[idx].c); }
  function renderAnswer(c){
    const a=$('answer');
    if(!flipped){ a.innerHTML=`<button type="button" class="fill" id="show">Mostra la resposta</button>`; $('show').onclick=flip; return; }
    if(prefs.mode==='free'){
      a.innerHTML=`<button type="button" style="--c:var(--again)" data-g="0">No la sabia</button><button type="button" class="fill" style="--c:var(--good)" data-g="1">La sabia</button>`;
    } else {
      const s=srs[c.id], L=['De nou','Difícil','Bé','Fàcil'], C=['again','hard','good','easy'];
      a.innerHTML=[1,2,3,4].map(g=>`<button type="button" style="--c:var(--${C[g-1]})" ${g===3?'class="fill"':''} data-g="${g}">${L[g-1]}<small>${fmtIvl(schedule(s,g))}</small></button>`).join('');
    }
    a.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  }
  function answer(g){
    const it=queue[idx]; if(!it) return;
    if(prefs.mode==='free'){
      if(g===0){ queue.splice(idx,1); it.dir=pickDir(); queue.splice(Math.min(queue.length,idx+4),0,it); } else idx++;
    } else {
      srs[it.c.id]=schedule(srs[it.c.id],g); persist(it.c.id);
      queue.splice(idx,1);
      if(g===1){ it.dir=pickDir(); queue.splice(Math.min(queue.length,idx+3),0,it); }
    }
    flipped=false; render();
  }

  // ---------- Cloze (complete the sentence) ----------
  const fold=s=>s.toLowerCase().normalize('NFC').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z\-]/g,'');
  function judge(given,target){
    if(given.trim()===target) return {ok:true};
    if(fold(given)===fold(target)) return {ok:true,warn:given.trim().toLowerCase()===target.toLowerCase()?'Compte amb les majúscules: en alemany els noms van en majúscula.':'Correcte! Fixa\'t en l\'ortografia exacta: '+target};
    return {ok:false};
  }
  function findTok(s,t){ try{ const m=new RegExp('(?<![A-Za-zÄÖÜäöüß])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-zÄÖÜäöüß])').exec(s); if(m) return m.index; }catch(e){} return s.indexOf(t); }
  function blankSentence(s,t,fill,cls){ const i=findTok(s,t); if(i<0) return esc(s); return esc(s.slice(0,i))+`<span class="gap ${cls||''}">${fill?esc(fill):'&nbsp;'.repeat(Math.max(4,Math.round(t.length*1.2)))}</span>`+esc(s.slice(i+t.length)); }
  function distractors(target,c){
    const cap=/^[A-ZÄÖÜ]/.test(target);
    const tl=target.toLowerCase(), seen=new Set([tl]), out=[];
    const pools=[cards.filter(x=>x!==c&&x.theme===c.theme), cards.filter(x=>x!==c)];
    for(const pool of pools){
      for(const x of shuffle(pool.slice())){
        for(const e of x.ex){
          const w=e[2]; if(!w) continue;
          if(/^[A-ZÄÖÜ]/.test(w)!==cap||seen.has(w.toLowerCase())) continue;
          seen.add(w.toLowerCase()); out.push(w); break;
        }
        if(out.length>=3) return out;
      }
    }
    return out;
  }
  let clozeState=null;
  function renderCloze(){
    const it=queue[idx];
    if(!it){
      $('area').innerHTML=`<div class="done"><div class="pic">🏁</div><h2>Fet!</h2><div class="sub">${score.ok} encerts i ${score.bad} errors.</div><button class="linkbtn" id="more" type="button">Una altra ronda</button></div>`;
      $('more').onclick=buildQueue; return;
    }
    const c=it.c, [de,ca,t]=it.ex;
    if(!clozeState||clozeState.it!==it) clozeState={it,answered:false,opts:shuffle([t,...distractors(t,c)])};
    const S=clozeState;
    const controls = S.answered ? '' : prefs.ans==='type'
      ? `<div class="cz-in"><input id="czIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escriu la paraula" aria-label="Paraula que falta"><button class="btn fill" type="button" id="czGo" style="flex:none;padding:10px 16px">Comprova</button></div>
         <div class="uml">${['ä','ö','ü','ß','Ä','Ö','Ü'].map(ch=>`<button type="button" data-ch="${ch}">${ch}</button>`).join('')}</div>`
      : `<div class="opts">${S.opts.map(o=>`<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    const fb = S.answered ? `<div class="feedback ${S.ok?'ok':'bad'}"><span class="r">${S.ok?'Correcte!':'La resposta era: '+esc(t)}</span>${S.warn?`<span>${esc(S.warn)}</span>`:''}<span><b>${deHead(c)}</b>: ${esc(c.ca)}${c.extra?' ('+esc(c.extra)+')':''}</span>${c.note?`<span class="note">${esc(c.note)}</span>`:''}</div>
      <button class="btn fill" type="button" id="czNext">Següent</button>` : '';
    $('area').innerHTML=`<div class="panel" style="--art:${artColor(c.art)}">
        <div class="cz-top">${visual(c,false)}<span class="sub">${esc(c.theme)}</span></div>
        <p class="cz-sent">${S.answered?blankSentence(de,t,t,S.ok?'ok':'bad'):blankSentence(de,t)}</p>
        <p class="cz-tr">${esc(ca)}</p>
        ${controls}${fb}
      </div>
      <div class="nav"><button class="cz-switch" type="button" id="ansQuick">${prefs.ans==='type'?'Prefereixo triar':'Prefereixo escriure'}</button><span style="font-variant-numeric:tabular-nums">${idx+1} de ${queue.length}</span></div>`;
    if(!S.answered){
      if(prefs.ans==='type'){
        const inp=$('czIn'); inp.focus({preventScroll:true});
        inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check(inp.value)}};
        $('czGo').onclick=()=>check(inp.value);
        document.querySelectorAll('.uml button').forEach(b=>b.onclick=()=>{const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+b.dataset.ch+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+1,p+1)});
      } else document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>check(b.dataset.o));
    } else $('czNext').onclick=()=>{ const ok=S.ok; if(!ok){ queue.splice(idx,1); const again={c:it.c,ex:it.ex}; queue.splice(Math.min(queue.length,idx+4),0,again); } else idx++; clozeState=null; renderCloze(); renderTop(); };
    function check(v){
      if(!v||!v.trim()) return;
      const r=judge(v,t); S.answered=true; S.ok=r.ok; S.warn=r.warn||'';
      if(r.ok) score.ok++; else score.bad++;
      renderCloze(); renderTop();
      const nx=$('czNext'); if(nx) nx.focus({preventScroll:true});
    }
  }

  // ---------- Texts with several gaps ----------
  let textScores=load('wortkarten-texts',{});
  function renderTexts(){
    if(!openText){
      let list=texts.filter(t=>theme==='Totes'||t.theme===theme);
      const note=list.length?'':`<div class="sub">Encara no hi ha cap text de <b>${esc(theme)}</b>. Aquí tens tots els textos.</div>`;
      if(!list.length) list=texts;
      $('area').innerHTML=`${note}<div class="tlist">${list.map(t=>{const n=(t.text.match(/\[\[/g)||[]).length, s=textScores[t.id];
        return `<button class="titem" type="button" data-id="${t.id}"><div><b>${esc(t.title)}</b><div class="meta">${esc(t.theme)}, ${n} buits</div></div>${s!=null?`<span class="score">${s}/${n}</span>`:''}</button>`}).join('')}</div>`;
      document.querySelectorAll('.titem').forEach(b=>b.onclick=()=>{openText={t:texts.find(x=>x.id===b.dataset.id),checked:false,showTr:false};renderTexts();window.scrollTo({top:0})});
      return;
    }
    const T=openText, t=T.t, gaps=[...t.text.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]);
    const bank=shuffle(gaps.slice());
    T.bank=T.bank||bank;
    let gi=0;
    const html=esc(t.text).replace(/\[\[(.+?)\]\]/g,(m,w)=>{
      const i=gi++; const prev=(T.vals&&T.vals[i])||'';
      if(prefs.ans==='type') return `<input data-i="${i}" value="${esc(prev)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buit ${i+1}" style="width:${Math.max(6,w.length+2)}ch">`;
      return `<select data-i="${i}" aria-label="Buit ${i+1}"><option value="">…</option>${T.bank.map(o=>`<option${o===prev?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    });
    $('area').innerHTML=`<div class="panel">
        <div class="row" style="justify-content:space-between"><button class="linkbtn" type="button" id="tBack">‹ Tots els textos</button><span class="sub">${esc(t.theme)}</span></div>
        <h2 style="font-family:var(--display);margin:0">${esc(t.title)}</h2>
        ${prefs.ans==='choice'?'':`<div class="bank" id="bank">${T.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div>`}
        <p class="ttext" id="ttext">${html}</p>
        ${T.showTr?`<p class="cz-tr">${esc(t.ca)}</p>`:''}
        <div class="row"><button class="btn fill" type="button" id="tCheck">Comprova</button><button class="btn" type="button" id="tTr">${T.showTr?'Amaga la traducció':'Mostra la traducció'}</button></div>
        <div id="tRes"></div>
      </div>`;
    const ctrls=[...document.querySelectorAll('#ttext [data-i]')];
    const syncVals=()=>{T.vals=ctrls.map(x=>x.value)};
    ctrls.forEach(x=>x.addEventListener('input',()=>{syncVals();markBank()}));
    ctrls.forEach(x=>x.addEventListener('change',syncVals));
    function markBank(){ const b=$('bank'); if(!b) return; const used=ctrls.map(x=>fold(x.value)); const spans=[...b.children]; const taken=used.slice(); spans.forEach(sp=>{const k=taken.indexOf(fold(sp.textContent)); sp.classList.toggle('used',k>=0); if(k>=0) taken[k]=null;}); }
    markBank();
    $('tBack').onclick=()=>{openText=null;renderTexts()};
    $('tTr').onclick=()=>{syncVals();T.showTr=!T.showTr;renderTexts()};
    $('tCheck').onclick=()=>{
      syncVals(); let ok=0;
      ctrls.forEach((x,i)=>{
        x.classList.remove('ok','bad'); const nxt=x.nextSibling; if(nxt&&nxt.classList&&nxt.classList.contains('fix')) nxt.remove();
        const r=judge(x.value||'',gaps[i]);
        if(r.ok){ok++;x.classList.add('ok')} else {x.classList.add('bad'); x.insertAdjacentHTML('afterend',`<span class="fix">${esc(gaps[i])}</span>`)}
      });
      textScores[t.id]=ok; store('wortkarten-texts',textScores);
      $('tRes').innerHTML=`<div class="feedback ${ok===gaps.length?'ok':'bad'}"><span class="r">${ok} de ${gaps.length} correctes${ok===gaps.length?' 🎉':''}</span>${ok<gaps.length?'<span>Les correctes surten en verd al costat de cada error.</span>':''}</div>`;
    };
  }

  // ---------- real photos (assets + db) ----------
  let pending=null, busy=false;
  function setStatus(t){const s=$('pstatus'); if(s) s.textContent=t}
  function pickPhoto(id){ if(busy) return; pending=id; $('fileIn').value=''; $('fileIn').click(); }
  async function shrink(file){
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
      const max=900, s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*s); cv.height=Math.round(img.naturalHeight*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      return await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
    } finally { URL.revokeObjectURL(url) }
  }
  $('fileIn').addEventListener('change',async()=>{
    const f=$('fileIn').files[0], id=pending; pending=null;
    if(!f||!id||!assets||!db) return;
    busy=true; setStatus('Pujant la foto…');
    try{
      const blob=await shrink(f);
      const up=await assets.upload(blob||f);
      const old=photos[id];
      await db.doc('photos/'+id).set({assetId:up.id});
      photos[id]=up.id;
      if(old){try{await assets.delete(old)}catch(e){}}
      render();
    }catch(e){ setStatus('No s\'ha pogut pujar. Prova amb una altra imatge.') }
    busy=false;
  });
  async function removePhoto(id){
    if(!photos[id]||busy) return;
    busy=true;
    try{ const old=photos[id]; await db.doc('photos/'+id).delete(); delete photos[id]; try{await assets.delete(old)}catch(e){} render(); }
    catch(e){ setStatus('No s\'ha pogut treure la foto.') }
    busy=false;
  }

  (async()=>{
    try{
      const [d,a,u]=await Promise.all([claude.use('db'),claude.use('assets'),claude.use('user')]);
      db=d; assets=d?a:null;
      if(!db) return;
      db.collection('photos').onSnapshot(qs=>{
        for(const k in photos) delete photos[k];
        qs.docs.forEach(doc=>{const v=doc.data(); if(v&&v.assetId) photos[doc.id]=v.assetId});
        if(!busy&&cards.length&&isCardMode()) render();
      },()=>{});
      const uid=u?await u.id():null;
      if(!uid) return;
      srsCol=db.doc('data/users/'+uid+'/srs').collection('cards');
      let first=true;
      srsCol.onSnapshot(qs=>{
        let changed=false;
        qs.docs.forEach(doc=>{const v=doc.data(); if(!v) return; const l=srs[doc.id]; if(!l||(v.t||0)>(l.t||0)){srs[doc.id]=v;changed=true}});
        if(first){
          first=false;
          const remote=new Set(qs.docs.map(x=>x.id));
          Object.keys(srs).forEach(id=>{ if(!remote.has(id)) persist(id); });
          $('sync').textContent='Progrés sincronitzat entre dispositius';
          if(changed){ store('wortkarten-srs',srs); if(prefs.mode==='srs'&&!flipped) buildQueue(); else renderTop(); }
        } else if(changed){ store('wortkarten-srs',srs); renderTop(); }
      },()=>{$('sync').textContent='Progrés només en aquest dispositiu'});
    }catch(e){}
  })();

  // ---------- controls ----------
  $('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.mode=b.dataset.mode;savePrefs();buildQueue()});
  $('dirSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.dir=b.dataset.dir;savePrefs();queue.forEach(it=>it.dir=pickDir());flipped=false;render()});
  $('ansSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.ans=b.dataset.ans;savePrefs();if(openText){openText.vals=null;} clozeState&&!clozeState.answered&&(clozeState=null); render()});
  $('showWord').addEventListener('change',()=>{prefs.showWord=$('showWord').checked;savePrefs();render()});
  $('newPerDay').addEventListener('change',()=>{prefs.newPerDay=+$('newPerDay').value;savePrefs();buildQueue()});
  $('posGrid').addEventListener('click',e=>{const b=e.target.closest('button[data-pos]');if(!b||b.disabled)return;const k=b.dataset.pos;posSel.has(k)?posSel.delete(k):posSel.add(k);store('wortkarten-pos',[...posSel]);buildQueue();});
  $('themes').addEventListener('click',e=>{const b=e.target.closest('.trow');if(!b)return;theme=b.dataset.t;closeSheet();buildQueue()});
  let openSheet=null, lastFocus=null;
  function showSheet(id){ lastFocus=document.activeElement; openSheet=$(id); openSheet.hidden=false; document.body.style.overflow='hidden';
    const f=openSheet.querySelector('[aria-current="true"]')||openSheet.querySelector('.sheet-head button'); if(f) f.focus({preventScroll:false}); }
  function closeSheet(){ if(!openSheet) return; openSheet.hidden=true; openSheet=null; document.body.style.overflow=''; if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
  $('themeBtn').onclick=()=>showSheet('themeSheet');
  $('setBtn').onclick=()=>showSheet('setSheet');
  document.querySelectorAll('.sheet').forEach(sh=>sh.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeSheet(); }));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&openSheet){ e.preventDefault(); closeSheet(); } },true);
  $('area').addEventListener('click',e=>{ if(e.target.id==='ansQuick'){ prefs.ans=prefs.ans==='type'?'choice':'type'; savePrefs(); clozeState&&!clozeState.answered&&(clozeState=null); render(); } });
  document.addEventListener('keydown',e=>{
    if(/INPUT|SELECT/.test(e.target.tagName)||openSheet)return;
    if(prefs.mode==='cloze'){ if(e.key==='Enter'&&$('czNext')){e.preventDefault();$('czNext').click()} if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opts button')[+e.key-1]; if(b) b.click()} return; }
    if(!$('card'))return;
    if(e.key===' '){e.preventDefault();flip();return}
    if(!flipped) return;
    if(prefs.mode==='srs'&&/^[1-4]$/.test(e.key)) answer(+e.key);
    if(prefs.mode==='free'){ if(e.key==='ArrowLeft')answer(0); if(e.key==='ArrowRight')answer(1); }
  });

  Promise.all([fetch('cards.json').then(r=>{if(!r.ok)throw 0;return r.json()}), fetch('texts.json').then(r=>r.ok?r.json():[]).catch(()=>[])])
    .then(([d,t])=>{cards=d;texts=t;buildQueue()})
    .catch(()=>{$('area').innerHTML='<div class="done"><div class="pic">⚠️</div><div>No s\'han pogut carregar les targetes. Torna a obrir la pàgina.</div></div>'});
})();
</script>
