<title>Wortkarten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Chivo:wght@400;700&family=Cabin:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@500;600;700&family=PT+Sans+Caption:wght@400;700&display=swap">
<style>
/* Layout: phone-sized app centred on a quiet desk; on phones the app fills the screen. Ink + highlighter palette (Radix slate + amber). */
:root{
  --desk:#e8e8ec; --bg:#f9f9fb; --surface:#ffffff; --subtle:#f0f0f3; --hover:#e8e8ec;
  --border:#d9d9e0; --border-strong:#cdced6; --fg:#1c2024; --fg2:#60646c; --fg3:#80838d;
  --ink:#1c2024; --on-ink:#ffffff; --accent:#ffc53d; --on-accent:#1c2024; --accent-soft:#fff7c2; --accent-border:#f3d673; --accent-text:#ab6400;
  --der:#0d74ce; --die:#ce2c31; --das:#2a7e3b; --ok:#2a7e3b; --ok-soft:#e9f6e9; --bad:#ce2c31; --bad-soft:#feebec; --info-soft:#e6f4fe; --warn:#cc4e00; --warn-soft:#ffefd6;
  --on-ok:#ffffff; --ring-track:rgba(255,255,255,.14); --again:#ce2c31; --hard:#cc4e00; --good:#2a7e3b; --easy:#0d74ce; --frame:#1c2024; --shadow:0 2px 6px rgba(28,32,36,.06),0 14px 30px -10px rgba(28,32,36,.18);
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif; --body:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0b0b0d; --bg:#111113; --surface:#18191b; --subtle:#212225; --hover:#272a2d;
  --border:#363a3f; --border-strong:#43484e; --fg:#edeef0; --fg2:#b0b4ba; --fg3:#777b84;
  --ink:#edeef0; --on-ink:#111113; --accent-soft:#302008; --accent-border:#5c3d05; --accent-text:#ffca16;
  --der:#70b8ff; --die:#ff9592; --das:#71d083; --ok:#71d083; --ok-soft:#1b2a1e; --bad:#ff9592; --bad-soft:#3b1219; --info-soft:#0d2847; --warn:#ffa057; --warn-soft:#331e0b;
  --on-ok:#111113; --ring-track:rgba(17,17,19,.12); --again:#ff9592; --hard:#ffa057; --good:#71d083; --easy:#70b8ff; --frame:#2e3135; --shadow:0 2px 6px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0b0b0d; --bg:#111113; --surface:#18191b; --subtle:#212225; --hover:#272a2d;
  --border:#363a3f; --border-strong:#43484e; --fg:#edeef0; --fg2:#b0b4ba; --fg3:#777b84;
  --ink:#edeef0; --on-ink:#111113; --accent-soft:#302008; --accent-border:#5c3d05; --accent-text:#ffca16;
  --der:#70b8ff; --die:#ff9592; --das:#71d083; --ok:#71d083; --ok-soft:#1b2a1e; --bad:#ff9592; --bad-soft:#3b1219; --info-soft:#0d2847; --warn:#ffa057; --warn-soft:#331e0b;
  --on-ok:#111113; --ring-track:rgba(17,17,19,.12); --again:#ff9592; --hard:#ffa057; --good:#71d083; --easy:#70b8ff; --frame:#2e3135; --shadow:0 2px 6px rgba(0,0,0,.4),0 14px 30px -10px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.device{width:390px;height:844px;border-radius:52px;border:10px solid var(--frame);background:var(--bg);overflow:hidden;position:relative;flex:none;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.panel{width:240px;display:flex;flex-direction:column;gap:18px}
.panel h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.02em}
.panel p{margin:0;color:var(--fg2);font-size:14px;line-height:1.5}
.panel .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.jump{display:flex;flex-direction:column;gap:2px}
.jump button{text-align:left;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--fg)}
.jump button:hover{background:var(--hover)}
.jump button[aria-current="true"]{background:var(--surface);font-weight:700;box-shadow:0 0 0 1px var(--border)}
@media (max-width:760px){
  .stage{padding:0;display:block;height:100%}
  .panel{display:none}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
/* app */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;font-size:15px}
.status .sys{display:flex;gap:6px;align-items:center}
@media (max-width:760px){.status{display:none}}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 20px;min-height:56px;flex:none}
.top h2{flex:1;margin:0;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em}
.streak{display:flex;gap:4px;align-items:center;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:6px 12px 6px 10px;font-weight:700;font-size:13px}
.avatar{width:44px;height:44px;display:grid;place-items:center}
.avatar span{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(16px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--fg2);min-height:52px}
.tab .pill{width:56px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .15s}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
.tab.create{color:var(--fg)}
.tab.create .pill{width:52px;height:36px;border-radius:14px;background:var(--accent);color:var(--on-accent);margin-top:-2px}
.tab.create:hover .pill{filter:brightness(.96)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card.raised{box-shadow:var(--shadow)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;font-weight:700;font-size:16px;padding:0 20px;width:100%;box-sizing:border-box;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--surface);border:1.5px solid var(--border-strong)}
.btn.ghost{min-height:44px;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--fg2)}
.small{font-size:13px}
.h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.der{color:var(--der)} .die{color:var(--die)} .das{color:var(--das)}
.art{font-weight:600}
.deck{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 14px;background:var(--surface);border:1px solid var(--border);border-radius:20px;text-align:left;width:100%}
.deck:hover{background:var(--subtle)}
.thumb{width:48px;height:48px;border-radius:14px;background:var(--subtle);display:grid;place-items:center;font-size:24px;flex:none}
.bar{display:block;height:4px;border-radius:2px;background:var(--hover);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.due{background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:700}
.prog{display:flex;align-items:center;gap:12px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.iconbtn.round{border-radius:50%;background:var(--subtle)}
.flash{position:relative;flex:1;min-height:0;perspective:1400px}
.flash .face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;backface-visibility:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.flash .back{transform:rotateY(180deg)}
.flash.flipped .front{transform:rotateY(-180deg)}
.flash.flipped .back{transform:rotateY(0)}
.flash .front{align-items:center;justify-content:center;gap:10px;cursor:pointer}
.imgbox{height:130px;background:var(--subtle);display:grid;place-items:center;font-size:56px;flex:none}
.word{font-family:var(--display);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1.1;text-align:center}
.tag{align-self:flex-start;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--info-soft);color:var(--der)}
.ex{border-left:3px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:2px}
.ex b{font-weight:700}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));flex:none}
.rate button{min-height:60px;border-radius:14px;background:var(--subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700}
.rate button small{font-weight:400;font-size:12px;opacity:.75}

.rate .good{background:var(--ok);color:var(--on-ok)}
.rate .easy{background:var(--info-soft);color:var(--der);box-shadow:inset 0 0 0 1.5px var(--der)}
.hint{text-align:center;color:var(--fg3);font-size:13px}
.opt{min-height:58px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border-strong);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px}
.opt.ok{background:var(--ok-soft);border:2px solid var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border:2px solid var(--bad);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--ok-soft)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad b{color:var(--bad)}
.gap{display:inline-block;min-width:4.5ch;border-bottom:3px solid var(--accent);color:var(--accent-text);text-align:center;padding:0 3px;line-height:1.2}
.gap.ok{border-color:var(--ok);color:var(--ok)} .gap.bad{border-color:var(--bad);color:var(--bad)}
.input{min-height:52px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);padding:0 14px;font-size:17px;min-width:0;flex:1}
.keys{display:flex;gap:6px}
.keys button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:17px}
.seg{display:flex;gap:4px;padding:4px;background:var(--subtle);border-radius:14px}
.seg button{flex:1;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea{width:100%;box-sizing:border-box;min-height:200px;border-radius:20px;border:2px solid var(--ink);background:var(--surface);padding:16px;font-size:19px;line-height:1.55;resize:none}
.drop{border:2px dashed var(--border-strong);border-radius:20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;color:var(--fg2)}
.drop strong{color:var(--fg)}
.settings{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.settings .it{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px 0 16px;width:100%;text-align:left;box-sizing:border-box}
.settings .it+.it{border-top:1px solid var(--border)}
.settings .it span.grow{flex:1}
.mini-seg{display:flex;gap:2px;padding:3px;background:var(--subtle);border-radius:10px}
.mini-seg button{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.draft{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.draft.warn{border:1.5px solid var(--warn)}
.draft.off{opacity:.55}
.check{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;color:var(--on-ink)}
.check[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.note{border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.4;background:var(--info-soft)}
.pick{min-height:40px;padding:0 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:14px}
.foot{flex:none;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--border)}
.sheet-wrap{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:20}
.sheet-wrap.anim{animation:fade .2s}
.sheet-wrap:not(.anim) .sheet{animation:none}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:80%;overflow-y:auto;animation:up .25s cubic-bezier(.2,.7,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);align-self:center}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:20px;right:20px;bottom:110px;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:14px 16px;font-weight:700;display:flex;gap:10px;align-items:center;z-index:30;animation:up .25s}
.gen{position:absolute;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px;text-align:center}
.gen ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;text-align:left}
.gen li{display:flex;gap:10px;align-items:center;color:var(--fg3);font-weight:600}
.gen li.on{color:var(--fg)} .gen li.done{color:var(--fg2)}
.gen .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;flex:none}
.gen li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.gen li.on .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mark{background:linear-gradient(transparent 58%,var(--accent) 58%,var(--accent) 92%,transparent 92%);padding:0 2px;margin:0 -2px}
:root[data-theme="dark"] .mark{color:var(--fg)}

.textp .gap{cursor:pointer;min-width:6ch}
.textp .gap.sel{background:var(--accent-soft);border-radius:4px 4px 0 0}
.days{display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--fg2)}
.day b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--subtle);color:var(--fg3);font-size:13px}
.day.done b{background:var(--accent);color:var(--on-accent)}
.day.today b{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 2px var(--ink)}
.lang{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);width:100%;text-align:left}
.lang .code{width:40px;height:40px;border-radius:10px;background:var(--subtle);display:grid;place-items:center;font-weight:700;font-size:13px}
.lang[aria-checked="true"]{background:var(--accent-soft);border:2px solid var(--accent);padding:13px 15px}
.lang[aria-checked="true"] .code{background:var(--accent);color:var(--on-accent)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);margin-left:auto;display:grid;place-items:center;flex:none}
.lang[aria-checked="true"] .radio{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat.acc{background:var(--accent-soft);border-color:var(--accent-border)} .stat.acc b{color:var(--accent-text)}

.hero{background:var(--ink);color:var(--on-ink);border-radius:24px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring-in b{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.ring-in span{font-size:13px;opacity:.75;margin-top:4px}
.hero-eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hero-sub{font-size:13px;opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:block}
.back-in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:none;box-sizing:border-box}
.back-img{flex:1 1 0;min-height:64px;max-height:240px;background:var(--subtle);display:grid;place-items:center;position:relative;overflow:hidden;border-top:5px solid var(--g)}
.back-img{container-type:size}
.back-img span{font-size:min(84px,62cqh);line-height:1}
.thumb.big{width:64px;height:64px;font-size:36px;border-radius:16px}
.pile{position:relative;flex:1;min-height:0}
.pile .flash{position:absolute;inset:0}
.flash.under{transform:translateY(10px) scale(.95);opacity:.7;pointer-events:none}
.flash.swipe{touch-action:pan-y;user-select:none;transition:transform .2s;--yes:0;--no:0}
.flash.swipe.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:22px;padding:6px 12px;border-radius:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;border:3px solid;pointer-events:none;z-index:3}
.stamp.yes{left:20px;color:var(--ok);border-color:var(--ok);opacity:var(--yes);transform:rotate(-10deg);background:var(--surface)}
.stamp.no{right:20px;color:var(--bad);border-color:var(--bad);opacity:var(--no);transform:rotate(10deg);background:var(--surface)}
.swipe-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 28px 12px;flex:none}
.sbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--border-strong)}
.sbtn.no{color:var(--bad)} .sbtn.yes{color:var(--ok)}
.sbtn:disabled{opacity:.35}
.textp{font-size:16.5px;line-height:1.95}
.view{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.view.enter{animation:viewIn .28s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
.flash.enter{animation:cardIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(36px) rotate(2deg) scale(.97)}}
.rate.in button{animation:pop .3s cubic-bezier(.2,.8,.2,1) backwards}

<script>
const DATA = {"cards": [{"id": "vertrag", "theme": "Tràmits i diners", "img": "📄", "de": "Vertrag", "art": "der", "pl": "die Verträge", "ca": "el contracte", "en": "contract", "pos": "noun", "ex": [["Ich habe den Vertrag unterschrieben.", "He signat el contracte.", "Vertrag"], ["Mein Vertrag endet im Juni.", "El meu contracte s'acaba al juny.", "Vertrag"], ["Lies den Vertrag genau!", "Llegeix bé el contracte!", "Vertrag"]]}, {"id": "bart", "theme": "El cos", "img": "🧔", "de": "Bart", "art": "der", "pl": "die Bärte", "ca": "la barba", "en": "beard", "pos": "noun", "ex": [["Er hat einen langen Bart.", "Té una barba llarga.", "Bart"], ["Ich rasiere meinen Bart.", "M'afaito la barba.", "Bart"], ["Der Bart steht dir gut.", "La barba et queda bé.", "Bart"]]}, {"id": "wimper", "theme": "El cos", "img": "👁️", "de": "Wimper", "art": "die", "pl": "die Wimpern", "ca": "la pestanya", "en": "eyelash", "pos": "noun", "ex": [["Sie hat lange Wimpern.", "Té les pestanyes llargues.", "Wimpern"], ["Ich habe eine Wimper im Auge.", "Tinc una pestanya a l'ull.", "Wimper"], ["Ohne mit der Wimper zu zucken.", "Sense immutar-se.", "Wimper"]]}, {"id": "knie", "theme": "El cos", "img": "🧎", "de": "Knie", "art": "das", "pl": "die Knie", "ca": "el genoll", "en": "knee", "pos": "noun", "ex": [["Mein Knie tut weh.", "Em fa mal el genoll.", "Knie"], ["Er kniet auf den Knien.", "Està de genolls.", "kniet"], ["Die Hose ist am Knie kaputt.", "Els pantalons estan trencats al genoll.", "Knie"]]}, {"id": "kuendigen", "theme": "Tràmits i diners", "img": "✂️", "de": "kündigen", "extra": "hat gekündigt", "ca": "donar de baixa, rescindir; dimitir", "en": "to cancel; to quit", "note": "No vol dir prohibir (això és verbieten).", "pos": "verb", "ex": [["Ich kündige meinen Handyvertrag.", "Dono de baixa el contracte del mòbil.", "kündige"], ["Sie hat ihren Job gekündigt.", "Ha deixat la feina.", "gekündigt"], ["Man muss drei Monate vorher kündigen.", "S'ha de donar de baixa amb tres mesos d'antelació.", "kündigen"]]}, {"id": "verwenden", "theme": "Paraules útils", "img": "🔧", "de": "verwenden", "extra": "hat verwendet", "ca": "fer servir, utilitzar", "en": "to use", "note": "Una mica més formal que benutzen.", "pos": "verb", "ex": [["Welches Programm verwendest du?", "Quin programa fas servir?", "verwendest"], ["Ich verwende nur frische Tomaten.", "Només faig servir tomàquets frescos.", "verwende"], ["Dieses Wort verwendet man oft.", "Aquesta paraula es fa servir sovint.", "verwendet"]]}, {"id": "rechnung", "theme": "Tràmits i diners", "img": "🧾", "de": "Rechnung", "art": "die", "pl": "die Rechnungen", "ca": "la factura; el compte", "en": "invoice, bill", "pos": "noun", "ex": [["Die Rechnung, bitte!", "El compte, si us plau!", "Rechnung"], ["Ich habe die Rechnung bezahlt.", "He pagat la factura.", "Rechnung"], ["Die Rechnung ist zu hoch.", "La factura és massa alta.", "Rechnung"]]}, {"id": "fehler", "theme": "Estudis", "img": "❌", "de": "Fehler", "art": "der", "pl": "die Fehler", "ca": "l'error", "en": "mistake, error", "pos": "noun", "ex": [["Das war mein Fehler.", "Va ser culpa meva.", "Fehler"], ["Ich mache noch viele Fehler.", "Encara faig molts errors.", "Fehler"], ["Im Code ist ein Fehler.", "Hi ha un error al codi.", "Fehler"]]}, {"id": "gruenden", "theme": "Feina i professions", "img": "🌱", "de": "gründen", "extra": "hat gegründet", "ca": "fundar, crear (una empresa)", "en": "to found", "note": "Una família també: eine Familie gründen.", "pos": "verb", "ex": [["Sie hat eine Firma gegründet.", "Ha fundat una empresa.", "gegründet"], ["Ich möchte ein Start-up gründen.", "Vull crear una start-up.", "gründen"], ["Wann wurde die Stadt gegründet?", "Quan es va fundar la ciutat?", "gegründet"]]}, {"id": "vereinbaren", "theme": "Tràmits i diners", "img": "📅", "de": "vereinbaren", "extra": "hat vereinbart", "ca": "acordar, concertar", "en": "to arrange, to agree", "pos": "verb", "ex": [["Ich möchte einen Termin vereinbaren.", "Voldria demanar hora.", "vereinbaren"], ["Wir haben einen Preis vereinbart.", "Hem acordat un preu.", "vereinbart"], ["Wie vereinbart, komme ich um neun.", "Com vam quedar, vinc a les nou.", "vereinbart"]]}, {"id": "knoechel", "theme": "El cos", "img": "🩼", "de": "Knöchel", "art": "der", "pl": "die Knöchel", "ca": "el turmell", "en": "ankle", "pos": "noun", "ex": [["Ich habe mir den Knöchel verstaucht.", "M'he torçat el turmell.", "Knöchel"], ["Der Knöchel ist geschwollen.", "El turmell està inflat.", "Knöchel"], ["Das Wasser geht bis zum Knöchel.", "L'aigua arriba fins al turmell.", "Knöchel"]]}, {"id": "schulter", "theme": "El cos", "img": "🤷", "de": "Schulter", "art": "die", "pl": "die Schultern", "ca": "l'espatlla", "en": "shoulder", "pos": "noun", "ex": [["Er zuckt mit den Schultern.", "Arronsa les espatlles.", "Schultern"], ["Meine Schulter tut weh.", "Em fa mal l'espatlla.", "Schulter"], ["Er hat breite Schultern.", "Té les espatlles amples.", "Schultern"]]}, {"id": "zuverlaessig", "theme": "Caràcter", "img": "🛡️", "de": "zuverlässig", "ca": "fiable, de confiança", "en": "reliable", "pos": "adj", "ex": [["Sie ist sehr zuverlässig.", "És molt de fiar.", "zuverlässig"], ["Der Bus ist nicht zuverlässig.", "El bus no és fiable.", "zuverlässig"], ["Ich brauche ein zuverlässiges Auto.", "Necessito un cotxe fiable.", "zuverlässiges"]]}, {"id": "benoetigen", "theme": "Tràmits i diners", "img": "🧰", "de": "benötigen", "extra": "benötigt", "ca": "necessitar", "en": "to need", "pos": "verb", "ex": [["Ich benötige mehr Zeit.", "Necessito més temps.", "benötige"], ["Was benötigst du für den Kurs?", "Què necessites per al curs?", "benötigst"], ["Für das Visum benötigt man einen Pass.", "Per al visat es necessita un passaport.", "benötigt"]]}], "texts": [{"id": "t-arzt", "theme": "El cos", "title": "Beim Arzt", "text": "Seit drei Tagen tut mir der [[Rücken]] weh. Heute bin ich zum Arzt gegangen. Er hat mir in den [[Hals]] geschaut und meinen [[Puls]] gemessen. Dann hat er gefragt: „Haben Sie auch Schmerzen in der [[Schulter]]?“ Ich habe gesagt, dass mein linkes [[Knie]] auch ein bisschen weh tut, weil ich beim Joggen gefallen bin. Er hat mir eine [[Therapie]] empfohlen und gesagt, dass [[Wärme]] den Muskeln hilft.", "ca": "Fa tres dies que em fa mal l'esquena. Avui he anat al metge. M'ha mirat la gola i m'ha pres el pols. Després m'ha preguntat: \"També té dolor a l'espatlla?\" Li he dit que el genoll esquerre també em fa una mica de mal, perquè vaig caure fent footing. M'ha recomanat una teràpia i m'ha dit que l'escalfor ajuda els músculs."}, {"id": "t-fitness", "theme": "Salut i esport", "title": "Meine Fitnessuhr", "text": "Seit einem Monat habe ich eine Fitnessuhr. Sie zählt meine [[Schritte]] und [[misst]] den Blutdruck. Am Anfang habe ich [[ständig]] alles gecheckt. Die Uhr [[warnt]] mich, wenn ich mich zu sehr anstrenge. Ich mache jetzt [[regelmäßig]] Sport, aber manchmal mache ich mir trotzdem einen [[faulen]] Tag. [[Obwohl]] die Uhr das nicht mag!", "ca": "Fa un mes que tinc un rellotge esportiu. Em compta els passos i em pren la pressió. Al principi ho comprovava tot constantment. El rellotge m'avisa quan m'esforço massa. Ara faig esport regularment, però de vegades em faig igualment un dia de mandra. Encara que al rellotge no li agradi!"}, {"id": "t-wg", "theme": "Casa i vida diària", "title": "Leben in der WG", "text": "Ich wohne in einer [[WG]] in Salzburg. Die [[Lage]] ist perfekt: Die Bushaltestelle ist direkt vor dem Haus. Wir sind drei Leute und teilen die [[Miete]]. Jeden Abend kocht jemand. Gestern hat Anna das Fleisch [[gebraten]], aber Oli hat schon alles [[aufgegessen]], bevor ich nach Hause gekommen bin! Am Wochenende müssen alle ihre Sachen [[wegräumen]]. Das ist unsere wichtigste [[Gewohnheit]].", "ca": "Visc en un pis compartit a Salzburg. La ubicació és perfecta: la parada de bus és just davant de casa. Som tres persones i ens repartim el lloguer. Cada vespre algú cuina. Ahir l'Anna va fer la carn a la paella, però l'Oli ja s'ho havia menjat tot abans que jo arribés a casa! El cap de setmana tothom ha d'endreçar les seves coses. És el nostre costum més important."}, {"id": "t-amt", "theme": "Tràmits i diners", "title": "Neue Stadt, neue Papiere", "text": "Nach dem Umzug muss man viel organisieren. Zuerst habe ich meinen [[Personalausweis]] und eine [[Kopie]] vom Mietvertrag zum Amt gebracht. Dann musste ich mein Diplom [[anerkennen]] lassen. Ich weiß nicht, wer dafür [[zuständig]] ist. Außerdem will ich meinen alten Handyvertrag [[kündigen]] und einen neuen [[abschließen]]. Und am Ende kommt noch die [[Steuererklärung]]...", "ca": "Després de la mudança s'han d'organitzar moltes coses. Primer vaig portar el DNI i una còpia del contracte de lloguer a l'ajuntament. Després vaig haver d'homologar el meu títol. No sé qui se n'encarrega. A més, vull donar de baixa el meu antic contracte de mòbil i fer-ne un de nou. I al final encara arriba la declaració de la renda..."}, {"id": "t-job", "theme": "Feina i professions", "title": "Traumjob gesucht", "text": "Hoa sucht eine neue Stelle. Sie hat schon viel [[Arbeitserfahrung]] in Cafés, aber sie möchte eine [[Fixanstellung]]. Ihr letzter Vertrag war [[befristet]]. Bei der [[Berufsberatung]] hat man ihr gesagt, dass sie zur [[Messe]] gehen soll. Dort gibt es viele [[Vorträge]] zum Thema [[Selbstständigkeit]]. Vielleicht wird sie bald eine erfolgreiche [[Unternehmerin]]!", "ca": "La Hoa busca una feina nova. Ja té molta experiència laboral en cafeteries, però vol un contracte indefinit. El seu últim contracte era temporal. A orientació professional li han dit que vagi a la fira. Allà hi ha moltes xerrades sobre treballar per compte propi. Potser aviat serà una empresària d'èxit!"}, {"id": "t-wandern", "theme": "El temps", "title": "Wanderung am Wochenende", "text": "Am Samstag sind wir in den Bergen [[gewandert]]. Am Morgen war es [[neblig]] und ziemlich [[kalt]], aber dann ist die [[Sonne]] gekommen. Laut [[Wetterbericht]] sollte es am Nachmittag ein [[Gewitter]] geben. Zum Glück hatte ich meinen [[Regenschirm]] dabei. Die Landschaft war unglaublich schön!", "ca": "Dissabte vam fer una excursió per la muntanya. Al matí hi havia boira i feia força fred, però després va sortir el sol. Segons la previsió, a la tarda hi havia d'haver tempesta. Per sort portava el paraigua. El paisatge era increïblement bonic!"}, {"id": "t-reise", "theme": "Verbs amb sein (Perfekt)", "title": "Ein verrückter Urlaub", "text": "Letzten Sommer [[bin]] ich nach Griechenland geflogen. Das Flugzeug ist pünktlich [[gelandet]]. Am ersten Tag sind wir im Meer [[geschwommen]] und am zweiten Tag [[gesegelt]]. Am dritten Tag ist etwas Komisches [[passiert]]: Ein Hund ist mir den ganzen Tag [[gefolgt]]! Am Abend bin ich so müde gewesen, dass ich sofort [[eingeschlafen]] bin.", "ca": "L'estiu passat vaig volar a Grècia. L'avió va aterrar puntual. El primer dia vam nedar al mar i el segon vam navegar a vela. El tercer dia va passar una cosa estranya: un gos em va seguir tot el dia! Al vespre estava tan cansat que em vaig adormir de seguida."}, {"id": "t-hochzeit", "theme": "Família i relacions", "title": "Die Hochzeit meiner Cousine", "text": "Meine Cousine ist seit einem Jahr [[verlobt]]. Nächsten Monat ist die [[Hochzeit]]. Sie hat mich [[eingeladen]] und ich freue mich sehr! Ihr Freund ist sehr [[nett]] und sie haben eine tolle [[Beziehung]]. Ihre Eltern haben sich vor zehn Jahren [[scheiden]] lassen, aber zur Hochzeit kommen beide. Wir werden die ganze Nacht [[feiern]]!", "ca": "La meva cosina fa un any que està promesa. El mes que ve és el casament. M'ha convidat i em fa molta il·lusió! El seu xicot és molt simpàtic i tenen una relació genial. Els seus pares es van divorciar fa deu anys, però al casament hi aniran tots dos. Farem festa tota la nit!"}, {"id": "t-dieb", "theme": "Aspecte i roba", "title": "Wer ist der Dieb?", "text": "Gestern hat jemand mein Fahrrad [[gestohlen]]. Eine Nachbarin hat den Mann [[beobachtet]]. Ihre [[Beschreibung]]: Er hat einen langen [[Bart]] und trägt einen schwarzen [[Kapuzenpulli]] mit einer lustigen [[Aufschrift]]. Dazu weiße [[Turnschuhe]] und eine sehr [[weite]] Hose. Er hat [[verdächtig]] ausgesehen. Die Polizei sucht ihn jetzt.", "ca": "Ahir algú em va robar la bici. Una veïna va observar l'home. La seva descripció: té una barba llarga i porta una dessuadora negra amb caputxa amb un text divertit. A més, sabatilles blanques i uns pantalons molt amples. Feia cara de sospitós. Ara la policia el busca."}, {"id": "t-kurs", "theme": "Estudis", "title": "Mein Deutschkurs", "text": "Ich besuche dreimal pro Woche einen Deutschkurs. Der [[Unterricht]] beginnt um 18 Uhr. Die Lehrerin schreibt neue Wörter an die [[Tafel]] und wir müssen sie [[unterstreichen]]. Meine [[Aussprache]] ist noch nicht perfekt, deshalb muss ich viel [[üben]]. Ich mache noch viele [[Fehler]], aber ich mache auch [[Fortschritte]]. Am Ende will ich [[fließend]] sprechen.", "ca": "Vaig a un curs d'alemany tres cops per setmana. La classe comença a les 18 h. La professora escriu paraules noves a la pissarra i les hem de subratllar. La meva pronunciació encara no és perfecta, per això he de practicar molt. Encara faig molts errors, però també progresso. Al final vull parlar amb fluïdesa."}, {"id": "t-mitbewohner", "theme": "Caràcter", "title": "Meine Mitbewohner", "text": "Oli ist sehr [[ruhig]] und ein bisschen [[schüchtern]]. Er sagt nicht viel, aber er ist sehr [[zuverlässig]]. Anna ist das [[Gegenteil]]: Sie ist immer [[fröhlich]] und erzählt [[ständig]] lustige Geschichten. Manchmal ist sie auch ein bisschen [[faul]], aber sie ist eine [[treue]] Freundin.", "ca": "L'Oli és molt tranquil i una mica tímid. No parla gaire, però és molt de fiar. L'Anna és tot el contrari: sempre està alegre i explica constantment històries divertides. De vegades també és una mica gandula, però és una amiga fidel."}, {"id": "t-meinung", "theme": "Connectors i adverbis", "title": "Lohnt sich ein Master im Ausland?", "text": "Ein Master im Ausland ist [[zwar]] teuer, [[aber]] er hat viele Vorteile. Man lernt [[nicht]] nur eine neue Sprache, [[sondern]] auch eine neue Kultur kennen. [[Je]] länger man bleibt, [[desto]] besser versteht man die Leute. [[Obwohl]] es am Anfang anstrengend ist, lohnt es sich [[sicher]].", "ca": "Un màster a l'estranger és car, però té molts avantatges. No només aprens una llengua nova, sinó també una cultura nova. Com més temps et quedes, millor entens la gent. Encara que al principi és cansat, segur que val la pena."}, {"id": "t-tiere", "theme": "Animals", "title": "Ein Tag auf dem Bauernhof", "text": "Am Sonntag waren wir auf einem Bauernhof in den Alpen. Dort gibt es viele [[Kühe]] und [[Schafe]]. Der [[Hund]] hat die ganze Zeit [[gebellt]]. Die Kinder haben die [[Hühner]] gefüttert und ein [[Pferd]] gestreichelt. Im Wald haben wir sogar ein [[Reh]] gesehen!", "ca": "Diumenge vam anar a una granja als Alps. Allà hi ha moltes vaques i ovelles. El gos va estar bordant tota l'estona. Els nens van donar de menjar a les gallines i van acariciar un cavall. Al bosc fins i tot vam veure un cabirol!"}, {"id": "t-anruf", "theme": "Opinió i comunicació", "title": "Ärger mit dem Stromanbieter", "text": "Ich habe eine hohe [[Nachzahlung]] bekommen. Das muss ein [[Missverständnis]] sein! Ich habe [[mehrmals]] bei der Hotline angerufen, aber niemand hat [[reagiert]]. Dann habe ich eine E-Mail geschrieben: „Ich freue mich auf Ihre [[Rückmeldung]].“ Am Ende hat man mir recht gegeben. Ich habe mich natürlich [[bedankt]].", "ca": "M'ha arribat una regularització molt alta. Ha de ser un malentès! He trucat diverses vegades a la línia d'atenció, però ningú no ha respost. Després he escrit un correu: \"Espero la seva resposta.\" Al final m'han donat la raó. És clar que els he donat les gràcies."}]};

 <section class="card" style="padding:14px 16px;gap:10px">
  <div class="row" style="gap:8px"><span style="color:var(--accent-text)">${ic('flame',20)}</span><b style="flex:1">Ratxa de 12 dies</b><span class="muted small">Rècord 21</span></div>
  <div class="days">${['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map((d,i)=>`<div class="day ${i<3?'done':i===3?'today':''}">${d}<b>${i<3?ic('check',18,2.4):i===3?'Avui'.slice(0,0)+'24':21+i}</b></div>`).join('')}</div>
 </section>
 <div class="stats">
  <div class="stat"><b>412</b><span class="muted small">consolidades</span></div>
  <div class="stat"><b>86%</b><span class="muted small">encerts</span></div>
  <div class="stat"><b>63</b><span class="muted small">min setmana</span></div>
 </div>
 <section class="card" style="padding:14px 16px;gap:8px">
  <div class="row" style="justify-content:space-between"><b>586 paraules</b><span class="muted small" style="color:var(--ok);font-weight:700">+24 aquesta setmana</span></div>
  <div class="kbar" aria-hidden="true"><i style="flex:412;background:var(--good)"></i><i style="flex:96;background:var(--accent)"></i><i style="flex:78;background:var(--hover)"></i></div>
  <div class="row muted" style="gap:10px;font-size:12.5px;white-space:nowrap"><span class="row" style="gap:6px"><i class="dot" style="background:var(--good)"></i>412 consolidades</span><span class="row" style="gap:6px"><i class="dot" style="background:var(--accent)"></i>96 aprenent</span><span class="row" style="gap:6px"><i class="dot" style="background:var(--hover)"></i>78 sense veure</span></div>
 </section>`;
 const aj = `
 <div class="grp"><div class="eyebrow">Estudi</div>
 <div class="settings">${[['globe','Llengües',`${S.base.toUpperCase()} → ${S.target.toUpperCase()}`],['sliders','Noves per dia',String(S.opt.rf.newPerDay)],['repeat','Direcció',{de:'DE → CA',ca:'CA → DE',mix:'Barrejat'}[S.opt.rf.dir]],['bell','Recordatori','19:00']].map(([i,l,v])=>`<button class="it" ${l==='Noves per dia'||l==='Direcció'?'data-act="sheet" data-v="opt-rf"':''}><span class="muted">${ic(i,20)}</span><span class="grow">${l}</span><span class="muted">${v}</span><span style="color:var(--fg3)">${ic('right',18)}</span></button>`).join('')}</div></div>
 <div class="grp"><div class="eyebrow">Aparença</div>
 <div class="settings"><div class="it"><span class="muted">${ic('moon',20)}</span><span class="grow">Tema</span><div class="mini-seg">${themeBtns()}</div></div><div class="it" style="flex-wrap:wrap;padding-block:10px"><span class="muted">${ic('pencil',20)}</span><span class="grow">Lletra</span><div class="mini-seg">${fontBtns()}</div></div></div></div>
 <div class="grp"><div class="eyebrow">Compte</div>
 <div class="settings"><button class="it"><span class="muted">${ic('download',20)}</span><span class="grow">Exporta les meves dades</span><span style="color:var(--fg3)">${ic('right',18)}</span></button><button class="it" data-go="welcome"><span class="muted">${ic('logout',20)}</span><span class="grow">Tanca la sessió</span></button><button class="it" style="color:var(--bad)">${ic('x',20)}<span class="grow">Elimina el compte</span></button></div></div>`;
return `<div class="app">${statusBar()}
<div class="row" style="padding:4px 20px 6px 8px;gap:10px"><button class="iconbtn" data-act="back" aria-label="Enrere">${ic('left',24)}</button><span style="width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none">JB</span><span style="flex:1;min-width:0"><b style="font-family:var(--display);font-size:20px;display:block;line-height:1.1">Jordi</b><span class="muted small">${LANGS.find(l=>l[0]===S.base)[1]} → ${LANGS.find(l=>l[0]===S.target)[1]} · B1</span></span></div>
<div style="padding:0 20px 8px"><div class="seg" role="tablist">${[['prog','Progrés'],['aj','Ajustos']].map(([k,l])=>`<button role="tab" aria-pressed="${tab===k}" aria-selected="${tab===k}" data-act="profTab" data-v="${k}">${l}</button>`).join('')}</div></div>
<div class="scroll ${tab==='prog'?'prog-grid':'profile-grid'}" style="gap:12px;padding-top:4px">${tab==='prog'?prog:aj}</div></div>`; };

const themeBtns = () => [['light','Clar'],['dark','Fosc'],['auto','Auto']].map(([k,l])=>`<button aria-pressed="${S.theme===k}" data-act="theme" data-v="${k}">${l}</button>`).join('');

/* ---------- router ---------- */
let prev='today'; let lastScreen=null;
const NAV=[['today','Repàs','repeat'],['all','Totes','layers'],['cloze','Frases','message'],['texts','Textos','file']];
const sideHTML=()=>`<aside class="side"><div class="row" style="gap:10px;padding:4px 8px 18px">${logo(30)}<b style="font-family:var(--display);font-size:20px;letter-spacing:-.02em">Wortkarten</b></div><button class="btn accent" data-go="create" style="min-height:46px">${ic('plus',20,2.2)}Crea targetes</button><nav class="side-nav">${NAV.map(([id,l,i])=>`<button data-go="${id}" ${(S.screen===id||false||(id==='texts'&&S.screen==='text'))?'aria-current="page"':''}>${ic(i,20)}${l}</button>`).join('')}</nav><div style="margin-top:auto;display:flex;flex-direction:column;gap:10px"><span class="streak" style="align-self:flex-start">${ic('flame',16,2.2)}12 dies</span><button class="side-me" data-go="profile" ${S.screen==='profile'?'aria-current="page"':''}><span class="av">JB</span><span style="display:flex;flex-direction:column;text-align:left"><b>Jordi</b><span class="muted small">CA → DE · B1</span></span></button></div></aside>`;
function go(s){ if(s==='profile'&&S.screen!=='profile') prev=S.screen; if(s==='lang') S.langStep=1; S.screen=s; render(); }
const JUMP=[['welcome','Benvinguda'],['lang','Idiomes'],['today','Repàs'],['all','Totes (pràctica lliure)'],['create','Crear amb IA'],['refine','Crear: afinar petició'],['review','Revisió de la IA'],['cloze','Frases'],['texts','Textos'],['text','Text amb buits'],['profile','Perfil']];
function render(){
  if(S.screen==='refine'&&!S.refine){ S.create.src='ai'; S.refine={subs:['Facturació','Control de seguretat','Embarcament','Retards i cancel·lacions'],n:20,level:'B1',kind:'mix',dest:'new',name:'Aeroport',existing:'Natura i vacances'}; }
  if(S.screen==='review'&&!S.review) buildReview();
  if(S.screen==='text'&&!S.text.id){ const T=TEXTS[0]; S.text={...S.text,id:T.id,fills:{},sel:0,checked:false,ca:false,bank:shuffle([...gapsOf(T),'Bauch','Fieber'])}; }
  const changed = S.screen!==lastScreen; lastScreen=S.screen;
  const wideOk = S.view==='web' && !['welcome','lang'].includes(S.screen); const web = wideOk && S.webNav==='side';
  app.classList.toggle('is-web', S.view==='web'); app.classList.toggle('has-side', web); app.classList.toggle('wide', wideOk); app.classList.toggle('web-bottom', wideOk && S.webNav==='bottom');
  app.innerHTML = (web?sideHTML():'') + `<div class="view${changed?' enter':''}">` + V[S.screen]().replace(/^<div class="app">/,'').replace(/<\/div>$/,'') + (S.sheet?sheetHTML().replace('class="sheet-wrap"',S.sheetAnim?'class="sheet-wrap anim"':'class="sheet-wrap"'):'') + `</div>`;
  S.anim=false; S.sheetAnim=false;
  document.getElementById('url').textContent='wortkarten.app/'+({today:'repas',all:'totes',create:'crear',cloze:'frases',texts:'textos',text:'textos/beim-arzt',study:'repas',summary:'repas/fet',review:'crear/revisio',refine:'crear/afinar',profile:'perfil',welcome:'',lang:'benvinguda'}[S.screen]||'');
  document.getElementById('navSeg').innerHTML=[['side','Lateral'],['bottom','A baix']].map(([k,l])=>`<button aria-pressed="${S.webNav===k}" data-act="webNav" data-v="${k}">${l}</button>`).join(''); document.getElementById('navWrap').hidden=S.view!=='web';
  document.getElementById('viewSeg').innerHTML=[['mobile','Mòbil'],['web','Web']].map(([k,l])=>`<button aria-pressed="${S.view===k}" data-act="viewMode" data-v="${k}">${l}</button>`).join('');
  document.querySelector('.stage').classList.toggle('mode-web', S.view==='web');
  if(S.toast) app.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${ic('check',20,2.4)}${esc(S.toast)}</div>`);
  document.getElementById('jump').innerHTML = JUMP.map(([k,l])=>`<button data-go="${k}" aria-current="${S.screen===k}">${l}</button>`).join('');
  document.getElementById('themeSeg').innerHTML = themeBtns();
  document.getElementById('fontSeg').innerHTML = fontBtns();
  document.getElementById('fontNote').textContent = FONTS[S.font][1]+' + '+FONTS[S.font][2]+'. '+FONTS[S.font][3];
  bindSwipe();
  const ta=app.querySelector('textarea'); if(ta) ta.oninput=e=>{S.create.text=e.target.value; const n=S.create.text.split('\n').map(s=>s.trim()).filter(Boolean).length; const b=app.querySelector('[data-act="generate"]'); if(b){b.disabled=!n; b.lastChild.textContent='Crea '+n+' targetes';} const c=app.querySelector('#wcount'); if(c) c.textContent=n+' / 50';};
  const ap=app.querySelector('#aiPrompt'); if(ap) ap.oninput=e=>S.create.ai=e.target.value;
  const dn=app.querySelector('#deckName'); if(dn) dn.oninput=e=>S.refine.name=e.target.value;
  const ci=app.querySelector('#clozeIn'); if(ci) ci.oninput=e=>S.cloze.typed=e.target.value;
  const f=app.querySelector('[data-form="cloze"]'); if(f) f.onsubmit=e=>{e.preventDefault(); if(!S.cloze.typed.trim()) return; S.cloze.picked=S.cloze.typed; render();};
}
function toast(m){ S.toast=m; render(); setTimeout(()=>{S.toast=null; render();},1800); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]'); if(!el) return;
  if(el.dataset.go){ go(el.dataset.go); return; }
  const a=el.dataset.act, v=el.dataset.v;
  if(a==='closeSheet' && e.target.closest('[data-stop]') && el.classList.contains('sheet-wrap')) return;
  const A = {
    pickLang(){ S[S.langStep===1?'base':'target']=v; render(); },
    langNext(){ if(S.langStep===1){ if(S.target===S.base) S.target=S.base==='de'?'en':'de'; S.langStep=2; render(); } else go('today'); },
    langBack(){ S.langStep=1; render(); },
    startStudy, flip(){ flipStudy(); },
    rate(){ rateStudy(v); },
    openDeck(){ S.all.decks=CARDS.some(c=>c.theme===v)?[v]:[]; resetAll(); go('all'); },
    allYes(){ flyOut(1); }, allNo(){ flyOut(-1); },
    allShuffle(){ resetAll(); render(); },
    sheet(){ S.sheet=v; S.sheetAnim=true; render(); }, closeSheet(){ S.sheet=null; render(); },
    opt(){ const k=el.dataset.k, tgt=S.sheet.slice(4), o=S.opt[tgt]; o[k]=k==='showWord'?v==='true':(k==='dir'?v:(v==='all'?'all':+v)); if(tgt==='all'&&k!=='showWord') resetAll(); try{localStorage.setItem('wk-opt',JSON.stringify(S.opt))}catch(e){} render(); },
    setPos(){ const a=S[S.sheet]; a.pos=a.pos.includes(v)?a.pos.filter(x=>x!==v):[...a.pos,v]; if(S.sheet==='all') resetAll(); render(); }, setDeck(){ const a=S[S.sheet]; if(v==='Totes') a.decks=[]; else a.decks=a.decks.includes(v)?a.decks.filter(x=>x!==v):[...a.decks,v]; if(S.sheet==='all') resetAll(); render(); },
    src(){ S.create.src=v; render(); }, fakeUpload(){ generate(); }, generate,
    toggleDraft(){ const r=S.review.find(x=>x.id===v); r.on=!r.on; render(); },
    pickDraft(){ const r=S.review.find(x=>x.id==='r4'); r.picked=v; r.de=v; r.ca=v==='durchsichtig'?'transparent':'mitjà, normal'; r.meta='adjectiu · 3 frases'; r.on=true; r.img=v==='durchsichtig'?'🔍':'📊'; render(); },
    save(){ const R=S.review; const n=R.filter(r=>r.on).length+(R.more||0); const ai=S.create.src==='ai'; const dest=ai?(S.refine.dest==='new'?S.refine.name+' (mazo nou)':S.refine.existing):'Llibreta B1'; S.review=null; if(!ai) S.create.text=''; go('all'); toast(n+' targetes desades a '+dest); },
    aiRefine(){ aiRefine(); }, aiEx(){ S.create.ai='Vull targetes per '+v.toLowerCase(); render(); },
    refSub(){ const r=S.refine; r.subs=r.subs.includes(v)?r.subs.filter(x=>x!==v):[...r.subs,v]; render(); },
    refSet(){ const k=el.dataset.k; if(e.target.closest('input')) return; S.refine[k]=k==='n'?+v:v; render(); },
    clozeMode(){ S.cloze.mode=v; S.cloze.picked=null; S.cloze.typed=''; render(); },
    pickOpt(){ S.cloze.picked=v; render(); },
    key(){ const i=app.querySelector('#clozeIn'); S.cloze.typed=(i?i.value:S.cloze.typed)+v; render(); const j=app.querySelector('#clozeIn'); if(j){j.focus(); j.setSelectionRange(j.value.length,j.value.length);} },
    clozeNext(){ const z=S.cloze; z.n++; z.q=null; z.picked=null; z.typed=''; render(); },
    selGap(){ const t=S.text; const k=+v; const G=gapsOf(TEXTS.find(x=>x.id===t.id)); if(t.checked){ if(t.fills[k]!==G[k]){ delete t.fills[k]; t.checked=false; t.sel=k; } } else { if(t.fills[k]) delete t.fills[k]; t.sel=k; } render(); },
    fill(){ const t=S.text; const G=gapsOf(TEXTS.find(x=>x.id===t.id)); t.fills[t.sel]=v; for(let i=0;i<G.length;i++){ if(!t.fills[i]){ t.sel=i; break; } } render(); },
    textCheck(){ const t=S.text; const G=gapsOf(TEXTS.find(x=>x.id===t.id)); t.checked=true; t.done[t.id]=[G.filter((g,i)=>t.fills[i]===g).length,G.length]; render(); }, textClear(){ Object.assign(S.text,{fills:{},sel:0,checked:false}); render(); }, textReset(){ Object.assign(S.text,{fills:{},sel:0,checked:false}); render(); },
    openText(){ openText(v); }, closeText(){ go('texts'); }, toggleCa(){ S.text.ca=!S.text.ca; render(); },
    profTab(){ S.profTab=v; render(); },
    theme(){ S.theme=v; applyTheme(); render(); },
    webNav(){ S.webNav=v; try{localStorage.setItem('wk-nav',v)}catch(e){} render(); },
    viewMode(){ S.view=v; try{localStorage.setItem('wk-view',v)}catch(e){} if(v==='web'&&['welcome','lang'].includes(S.screen)) S.screen='today'; render(); },
    font(){ S.font=v; applyFont(); render(); },
    back(){ go(prev==='profile'?'today':prev); }, noop(){}
  };
  if(A[a]) A[a]();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.sheet) { if (e.key==='Escape'){ S.sheet=null; render(); } return; }
  if (S.screen==='today' && S.study.queue && S.study.queue[S.study.i]) {
    if (e.key===' '||e.key==='Enter') { e.preventDefault(); flipStudy(); }
    else if (S.study.revealed && ['1','2','3','4'].includes(e.key)) { e.preventDefault(); rateStudy(['again','hard','good','easy'][+e.key-1]); }
  } else if (S.screen==='all' && S.all.order.length) {
    if (e.key===' '||e.key==='Enter') { e.preventDefault(); const el=document.getElementById('swipe'); S.all.flipped=!S.all.flipped; if(el){ el.classList.remove('enter'); el.classList.toggle('flipped',S.all.flipped);} }
    else if (e.key==='ArrowRight') { e.preventDefault(); flyOut(1); }
    else if (e.key==='ArrowLeft') { e.preventDefault(); flyOut(-1); }
  }
});
applyTheme(); applyFont(); render();
</script>
